<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atelier</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <!-- Offline is the one piece of chrome that is always allowed to shout,
         because nothing else in the popup means anything when it is true. It
         retries on its own, so the copy says what is happening rather than
         handing out an instruction that is usually wrong. -->
    <div id="offline" class="banner" hidden>
      <strong>Not connected</strong>
      <span id="offline-why">Checking…</span>
      <button id="retry" class="ghost retry">Retry now</button>
    </div>

    <!-- What just happened, when something did. Empty and invisible the rest of
         the time: a popup with a permanent status line is a popup spending its
         one screen on reassurance. -->
    <p id="said" class="said" hidden></p>

    <!-- Needs you: first, because it is the only thing that is your move. -->
    <section id="blocked-section" hidden>
      <h2 class="label label-alert">Needs you</h2>
      <ul id="blocked" class="cards"></ul>
    </section>

    <section id="running-section" hidden>
      <h2 class="label">Running</h2>
      <ul id="running" class="cards"></ul>
    </section>

    <!--
      The workflows recorded on the site you are looking at.

      The popup is the surface you reach for *while on a page*, so it shows what
      that page can do and nothing else. Everything a project holds is a
      dashboard question, and the line below says how much of it there is so the
      filtering is visible rather than mysterious.
    -->
    <section id="here-section">
      <h2 class="label"><span id="here-label">On this page</span></h2>
      <ul id="here" class="list"></ul>
      <p id="here-empty" class="hint" hidden></p>
    </section>

    <section id="record-section">
      <button id="record" class="record">
        <span class="record-dot"></span>
        <span id="record-label">Record a workflow</span>
      </button>
      <p id="record-live" class="hint" hidden></p>
    </section>

    <p class="foot">
      <span id="elsewhere" class="muted"></span>
      <a id="dashboard-link" href="#" target="_blank" rel="noopener">Dashboard ↗</a>
    </p>

    <!-- Atelier's own dialog. The browser's confirm() is modal to the whole
         window and cannot be styled, and a popup that raises one is a popup
         that has already lost focus — which closes it. -->
    <div id="modal" class="modal" hidden>
      <div class="modal-card">
        <h3 id="modal-title"></h3>
        <p id="modal-body" class="hint"></p>
        <div class="actions">
          <button id="modal-go" class="primary"></button>
          <button id="modal-stop" class="ghost">Cancel</button>
        </div>
      </div>
    </div>

    <script type="module" src="panel.js"></script>
  </body>
</html>
