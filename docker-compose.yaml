# Atelier's daemon.
#
#   docker compose up -d
#   open http://127.0.0.1:7717  →  Connect  →  Download
#
# That is the whole of it. There is no .env to write, nothing to generate and
# nothing to choose: the image is built from this checkout, the state lives on a
# named volume, and each project's MCP token is issued when the project is
# created. Drop the downloaded .mcp.json beside a repository and Claude Code has
# the tools — pointed at that project, because the token says so.

services:
  atelier:
    build: .
    image: atelier
    # 127.0.0.1 on the left is the whole security posture, and the reason the
    # daemon's own loopback check is allowed to stand down inside the container:
    # the port is reachable from this machine and from nowhere else. Widen it to
    # "7717:7717" and you have published a browser-driving API to the network.
    ports:
      - '127.0.0.1:7717:7717'
    volumes:
      # Workflows, assets, the log and every project's token. Losing this means
      # re-recording everything, so it is a named volume rather than an
      # anonymous one, and it survives a rebuild.
      - atelier-data:/data
    restart: unless-stopped

volumes:
  atelier-data:
